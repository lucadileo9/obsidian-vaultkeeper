[tox]
envlist = py310, py311, py312, py313, py314, lint, typecheck
isolated_build = True

[testenv]
deps =
    pytest>=8.0.0
    pytest-cov>=5.0.0
commands =
    pytest --cov=vaultkeeper --cov-report=term-missing tests/

[testenv:lint]
deps =
    ruff>=0.6.0
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:typecheck]
deps =
    mypy>=1.10.0
    types-pyyaml
commands =
    mypy src/vaultkeeper/
